; Looking Glass client settings for gamevm (iGPU host, 1440p 240 Hz monitor).
; Full option list: looking-glass-client --help. Keys in this file override the defaults.
;
; `gamevm lg` gives these on its command line, where they win over this file, because they decide
; whether you can get out of the window again (see [looking_glass] in /etc/gamevm/gamevm.toml):
;   win:fullScreen, win:maximize, win:setGuestRes, input:autoCapture, input:escapeKey
; They are repeated here so that the client behaves the same when you start it by hand.

[lgmp]
; shared memory from the kvmfr module (DMA-BUF import = no CPU copy on the iGPU)
shmDevice=/dev/kvmfr0
allowDMA=yes

[win]
; A maximised window with its title bar, not full screen: while Windows runs Linux has one monitor
; left, and a full-screen window on it hides the whole desktop. Escape key + F switches.
fullScreen=no
maximize=yes
; Do not change Windows' resolution to the window's size: with "Duplicate these displays" that
; would change the main monitor too. The picture is scaled into the window instead.
setGuestRes=no
jitRender=no
quickSplash=yes
noScreensaver=yes

[input]
; The escape key: tap it to capture the mouse (and keyboard) for Windows and to let them go again;
; with Q it closes the window, with F it switches full screen; hold it to see all shortcuts.
; Right Ctrl, because every keyboard has it (the default, Scroll Lock, is missing on many).
escapeKey=KEY_RIGHTCTRL
; The mouse is not captured when the window opens: it moves in and out freely until you tap the
; escape key (capture is what games need).
autoCapture=no
; Do NOT also use gamevm's evdev Ctrl+Ctrl switch at the same time: keep evdev on the Linux side
; (press both Ctrl once after the VM starts) while you use Looking Glass.
rawMouse=yes
hideCursor=yes

[egl]
; both add presentation delay
vsync=no
doubleBuffer=no
mapHDRtoSDR=yes

[spice]
; SPICE only carries the clipboard (and fallback input); audio uses PipeWire via QEMU
enable=yes
host=127.0.0.1
port=5905
clipboard=yes
audio=no
